<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Игроки - QUADRANT</title>
<meta name="description" content="Игроки сервера QUADRANT.">
<meta name="theme-color" content="#060A12">
<link rel="icon" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="players">
<main class="wrap page">
  <div class="page-head"><div><div class="eyebrow">Сообщество</div><h1>Игроки</h1><p class="lead">Найдите игрока, посмотрите его профиль и напишите ему сообщение.</p></div></div>
  <div class="ptools"><input class="search" id="q" type="search" placeholder="Поиск по нику" maxlength="16" aria-label="Поиск по нику"><span class="pcount" id="cnt"></span></div>
  <div class="plist" id="list"><div class="empty">Загрузка...</div></div>
</main>
<script src="assets/app.js"></script>
<script>
const COVERS=["linear-gradient(120deg,#0B1E3B,#1A3F6E 45%,#3E6E9E)","linear-gradient(120deg,#062A3A,#0E5C8A 50%,#1FA6A0)","linear-gradient(120deg,#3A1A06,#9A4A12 50%,#D9A13A)","linear-gradient(120deg,#1A0B2E,#4B2A8A 50%,#2A6AD9)","linear-gradient(120deg,#2E0B12,#8A1F3A 50%,#D95A3A)","linear-gradient(120deg,#10161A,#2A3A44 50%,#5A6A74)"];
const list=document.getElementById("list"), cnt=document.getElementById("cnt"), qi=document.getElementById("q");
function card(p){
  const me=Q.me&&Q.me.nick.toLowerCase()===p.nick.toLowerCase();
  return `<div class="pcard"><div class="top" style="--cover:${COVERS[p.cover||0]||COVERS[0]}"></div><div class="body">
    <a href="player.html?nick=${encodeURIComponent(p.nick)}"><img class="av" src="${head(p.nick,64)}" alt="" loading="lazy"></a>
    <div class="nm"><a href="player.html?nick=${encodeURIComponent(p.nick)}">${esc(p.nick)}</a>${Q.adminStar(p)}${Q.roleBadge(p)}</div>
    <div class="bio">${p.bio?esc(p.bio):"<i>Описание отсутствует</i>"}</div>
    <div class="acts"><a class="btn" href="player.html?nick=${encodeURIComponent(p.nick)}">Профиль</a>${me?"":`<a class="btn btn-glow" href="messages.html?with=${encodeURIComponent(p.nick)}" data-msg>Написать</a>`}</div>
  </div></div>`;
}
let t;
async function load(){
  try{ const r=await Q.api.call("/players?q="+encodeURIComponent(qi.value.trim()));
    cnt.textContent=r.total?`Найдено: ${r.total}`:"";
    list.innerHTML=r.players.length?r.players.map(card).join(""):`<div class="empty">${qi.value?"Никого не нашли":"Пока нет зарегистрированных игроков"}</div>`;
  }catch(e){ list.innerHTML=`<div class="empty">${esc(e.message)}</div>`; }
}
qi.addEventListener("input",()=>{ clearTimeout(t); t=setTimeout(load,250); });
list.addEventListener("click",e=>{ if(e.target.closest("[data-msg]")&&!Q.me){ e.preventDefault(); Q.toast("Войдите, чтобы написать сообщение"); Q.openAuth("login"); } });
Q.init.then(load);
</script>
</body>
</html>
